name: Compilar Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Pruebas y compilación
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Descargar video Rickroll original para regresión
        shell: pwsh
        run: |
          $videoPath = "tests/fixtures/rickroll/Download.mp4"
          New-Item -ItemType Directory -Force -Path (Split-Path $videoPath) | Out-Null
          Invoke-WebRequest -Uri "https://d2ol7oe51mr4n9.cloudfront.net/user_39KIyte0zxFYPvCbvUeDaWgPdFA/6c981410-860b-4c5c-9b01-e43bc07212d4.mp4" -OutFile $videoPath
          $actualHash = (Get-FileHash -Path $videoPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "c3f36408d04ff9de5c254b4ae787f95b52a70383555a1580defd30b7dafe7622"
          if ($actualHash -ne $expectedHash) {
            throw "El video de regresión no coincide con el original. SHA256: $actualHash"
          }
          Write-Host "Video original verificado: $actualHash"

      - name: Validar importación del Rickroll con MediaPipe Heavy
        run: >
          python -m mocap_app.video_test
          --video tests/fixtures/rickroll/Download.mp4
          --template tests/fixtures/Steve_29532/Steve.miobject
          --output artifacts/regression/Rickroll_Dance_animado.miobject

      - name: Publicar resultado de la prueba de movimiento
        uses: actions/upload-artifact@v4
        with:
          name: Rickroll-Dance-Regression
          path: artifacts/regression/
          if-no-files-found: error
          retention-days: 14

      - name: Comprobar sintaxis
        run: python -m compileall -q main.py mocap_app tests

      - name: Crear aplicación para Windows
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name MineimatorMotionCapture
          --collect-all mediapipe
          --collect-all cv2
          --collect-all cv2_enumerate_cameras
          --collect-all PySide6
          main.py

      - name: Publicar un único ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: MineimatorMotionCapture-Windows
          path: dist/MineimatorMotionCapture/
          if-no-files-found: error
          retention-days: 14
