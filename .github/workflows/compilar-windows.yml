name: Compilar Windows

on:
  push:
    branches:
      - main
      - feature/rtmpose-motionbert
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motionbert-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Pruebas y compilación
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

          # PyTorch 2.1 CPU y NumPy 1.x mantienen la ABI usada por MMCV.
          python -m pip install "numpy==1.26.4"
          python -m pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu

          # Instala OpenMMLab sin OpenMIM: OpenMIM añade dependencias recientes
          # que pueden forzar NumPy 2.x y romper la compatibilidad de PyTorch 2.1.
          python -m pip install "mmengine==0.10.7"
          python -m pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/index.html

          # Dependencias de inferencia necesarias para RTMDet + RTMPose + MotionBERT.
          # MMPose declara chumpy como dependencia heredada para otras funciones
          # (SMPL/mesh); el pipeline human3d de keypoints no lo utiliza.
          python -m pip install six json-tricks munkres matplotlib pillow "xtcocotools==1.14.3" pycocotools scipy shapely terminaltables tqdm
          python -m pip install --no-deps -r requirements-mmpose.txt

          # Import smoke test: falla el workflow si falta un paquete o si la
          # combinación de NumPy/PyTorch/MMCV no puede cargarse.
          python -c "import numpy, torch, mmcv, mmengine, mmdet, mmpose, xtcocotools, pycocotools, matplotlib, PIL; from mmpose.apis import MMPoseInferencer; from mocap_app.motionbert import _motionbert_inferencer_kwargs; from pathlib import Path; cfg = _motionbert_inferencer_kwargs('Windows'); assert Path(cfg['det_model']).is_file(); assert numpy.__version__.startswith('1.26.'), numpy.__version__; assert torch.__version__.startswith('2.1.'), torch.__version__; print('OpenMMLab listo:', numpy.__version__, torch.__version__, mmcv.__version__, mmengine.__version__, mmdet.__version__, mmpose.__version__)"

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Comprobar inicialización real de RTMPose y MotionBERT
        shell: bash
        run: |
          set -euo pipefail
          python -c "from mocap_app.motionbert import create_motionbert_inferencer; engine=create_motionbert_inferencer(); assert hasattr(engine, 'inferencer'); print('RTMDet + RTMPose + MotionBERT inicializados correctamente en Windows')"

      - name: Comprobar sintaxis
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q main.py mocap_app tests

      - name: Crear aplicación para Windows
        shell: bash
        run: |
          set -euo pipefail

          # El paquete wheel de MMPose conserva sus configuraciones y metadatos
          # de alias dentro de mmpose/.mim. PyInstaller no siempre recoge esta
          # carpeta oculta automáticamente; también exponemos configs en la
          # raíz del bundle, donde MMPose busca sus configuraciones al resolver
          # los alias human3d / RTMPose.
          MMPOSE_MIM="$(python -c "from pathlib import Path; import mmpose; print(Path(mmpose.__file__).resolve().parent / '.mim')")"
          test -d "$MMPOSE_MIM/configs"
          test -f "$MMPOSE_MIM/model-index.yml"

          python -m PyInstaller --noconfirm --clean --windowed \
            --name MineimatorMotionCapture \
            --collect-all cv2 \
            --collect-all cv2_enumerate_cameras \
            --collect-all PySide6 \
            --collect-all torch \
            --collect-all torchvision \
            --collect-all mmcv \
            --collect-all mmengine \
            --collect-all mmdet \
            --collect-all mmpose \
            --collect-all xtcocotools \
            --add-data "$MMPOSE_MIM;mmpose/.mim" \
            --add-data "$MMPOSE_MIM/configs;configs" \
            --add-data "mocap_app/assets/faster_rcnn_r50_fpn_coco.py;mocap_app/assets" \
            main.py

      - name: Verificar recursos incluidos en la aplicación
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("dist/MineimatorMotionCapture")
          detector_configs = list(root.rglob("faster_rcnn_r50_fpn_coco.py"))
          assert detector_configs, "Falta el detector Windows dentro de la aplicación"

          mim_dirs = [
              path for path in root.rglob(".mim")
              if (path / "configs").is_dir()
              and (path / "model-index.yml").is_file()
          ]
          assert mim_dirs, "Faltan los metadatos .mim de MMPose dentro de la aplicación"

          config_dirs = [
              path for path in root.rglob("configs")
              if path.is_dir()
              and (path / "body_3d_keypoint").is_dir()
              and (path / "body_2d_keypoint").is_dir()
          ]
          assert config_dirs, "Falta el directorio configs de MMPose en el bundle"

          print("Detector incluido:", detector_configs[0])
          print("Metadatos MMPose incluidos:", mim_dirs[0])
          print("Configuraciones MMPose incluidas:", config_dirs[0])
          PY

      - name: Publicar un único ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: MineimatorMotionCapture-RTMPose-MotionBERT-Windows
          path: dist/MineimatorMotionCapture/
          if-no-files-found: error
          retention-days: 14
