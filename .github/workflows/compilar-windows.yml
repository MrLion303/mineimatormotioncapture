name: Compilar Windows

on:
  push:
    branches:
      - main
      - feature/rtmpose-motionbert
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motionbert-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Pruebas y compilación
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

          # PyTorch 2.1 CPU y NumPy 1.x mantienen la ABI usada por MMCV.
          python -m pip install "numpy==1.26.4"
          python -m pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu

          # Instala OpenMMLab sin OpenMIM: OpenMIM añade dependencias recientes
          # que pueden forzar NumPy 2.x y romper la compatibilidad de PyTorch 2.1.
          python -m pip install "mmengine==0.10.7"
          python -m pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/index.html

          # Dependencias de inferencia necesarias para RTMDet + RTMPose + MotionBERT.
          # MMPose declara chumpy como dependencia heredada para otras funciones
          # (SMPL/mesh); el pipeline human3d de keypoints no lo utiliza.
          python -m pip install six json-tricks munkres matplotlib pillow "xtcocotools==1.14.3" pycocotools scipy shapely terminaltables tqdm
          python -m pip install --no-deps -r requirements-mmpose.txt

          # Import smoke test: falla el workflow si falta un paquete o si la
          # combinación de NumPy/PyTorch/MMCV no puede cargarse.
          python -c "import numpy, torch, mmcv, mmengine, mmdet, mmpose, xtcocotools, pycocotools, matplotlib, PIL; from mmpose.apis import MMPoseInferencer; from mocap_app.motionbert import _motionbert_inferencer_kwargs; cfg = _motionbert_inferencer_kwargs('Windows'); assert cfg['det_model'] == 'whole_image'; assert numpy.__version__.startswith('1.26.'), numpy.__version__; assert torch.__version__.startswith('2.1.'), torch.__version__; print('OpenMMLab listo:', numpy.__version__, torch.__version__, mmcv.__version__, mmengine.__version__, mmdet.__version__, mmpose.__version__)"

      - name: Recuperar pesos de los modelos
        uses: actions/cache@v4
        with:
          path: .torch-windowed-smoke/hub/checkpoints
          key: motionbert-windows-torchhub-${{ hashFiles('requirements-mmpose.txt', 'requirements-dev.txt') }}

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Comprobar inicialización real de RTMPose y MotionBERT
        shell: bash
        env:
          TORCH_HOME: ${{ github.workspace }}/.torch-windowed-smoke
        run: |
          set -euo pipefail
          python -c "from mocap_app.motionbert import create_motionbert_inferencer; engine=create_motionbert_inferencer(); assert hasattr(engine, 'inferencer'); print('RTMDet + RTMPose + MotionBERT inicializados correctamente en Windows')"

      - name: Comprobar sintaxis
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q main.py mocap_app tests

      - name: Crear aplicación para Windows
        shell: bash
        run: |
          set -euo pipefail

          # MMEngine 0.10.7 busca primero configs y model-index.yml
          # junto a la carpeta del paquete mmpose (PyInstaller: _internal).
          # Se empaquetan juntos en esa raíz para evitar depender de que
          # PyInstaller conserve el directorio oculto .mim del wheel.
          MMPOSE_MIM="$(python -c "from pathlib import Path; import mmpose; print(Path(mmpose.__file__).resolve().parent / '.mim')")"
          test -d "$MMPOSE_MIM/configs"
          test -f "$MMPOSE_MIM/model-index.yml"

          python -m PyInstaller --noconfirm --clean --windowed \
            --name MineimatorMotionCapture \
            --collect-all cv2 \
            --collect-all cv2_enumerate_cameras \
            --collect-all PySide6 \
            --collect-all torch \
            --collect-all torchvision \
            --collect-all mmcv \
            --collect-all mmengine \
            --collect-all mmdet \
            --collect-all mmpose \
            --collect-all xtcocotools \
            --hidden-import mocap_app.video_test \
            --add-data "$MMPOSE_MIM/configs;configs" \
            --add-data "$MMPOSE_MIM/model-index.yml;." \
            --add-data "$MMPOSE_MIM/dataset-index.yml;." \
            main.py

      - name: Verificar recursos incluidos en la aplicación
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("dist/MineimatorMotionCapture")
          # PyInstaller 6 stores the onedir runtime under _internal.
          internal = root / "_internal"
          assert internal.is_dir(), "Falta la carpeta _internal del ejecutable"

          model_index = internal / "model-index.yml"
          configs = internal / "configs"
          assert model_index.is_file(), (
              "Falta _internal/model-index.yml; MMEngine no podrá resolver el alias human3d"
          )
          assert (configs / "body_3d_keypoint" / "motionbert" / "h36m"
                  / "motionbert_h36m.yml").is_file(), (
              "Falta el metafile de MotionBERT en _internal/configs"
          )
          assert (configs / "body_2d_keypoint" / "rtmpose" / "coco"
                  / "rtmpose_coco.yml").is_file(), (
              "Falta el metafile de RTMPose en _internal/configs"
          )
          assert (configs / "body_3d_keypoint" / "motionbert" / "h36m"
                  / "motionbert_dstformer-ft-243frm_8xb32-120e_h36m.py").is_file(), (
              "Falta la configuración Python de MotionBERT en _internal/configs"
          )

          print("Metadatos MMPose incluidos:", model_index)
          print("Configuraciones MMPose incluidas:", configs)
          PY


      - name: Probar RTMPose y MotionBERT desde el ejecutable empaquetado
        shell: bash
        env:
          TORCH_HOME: ${{ github.workspace }}/.torch-windowed-smoke
        run: |
          set -euo pipefail
          rm -f mmpose-smoke-test.log
          # Reutiliza los pesos entre compilaciones. En la primera ejecución se
          # descargan; GitHub Actions los guarda en caché si la prueba termina.
          if ! ./dist/MineimatorMotionCapture/MineimatorMotionCapture.exe --smoke-test-mmpose; then
            if [ -f mmpose-smoke-test.log ]; then
              cat mmpose-smoke-test.log
            else
              echo "El ejecutable falló en la prueba del motor y no generó un registro."
            fi
            exit 1
          fi
          test ! -f mmpose-smoke-test.log
          echo "El ejecutable empaquetado inicializó RTMPose y MotionBERT correctamente."

      - name: Procesar el video real y exportar la animación
        shell: pwsh
        env:
          TORCH_HOME: ${{ github.workspace }}/.torch-windowed-smoke
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = (Resolve-Path "dist/MineimatorMotionCapture/MineimatorMotionCapture.exe").Path
          $runtimeLog = Join-Path $env:LOCALAPPDATA "NegativeStudios/MineimatorMotionCapture/logs/runtime.log"
          Remove-Item $runtimeLog -Force -ErrorAction SilentlyContinue

          # Descarga el video original compartido por el usuario desde Google Drive.
          $videoPath = "artifacts/29532_prueba_normalizada.avi"
          $videoUrl = "https://drive.google.com/uc?export=download&id=11U3yterKrCsQQ-AqrCdmTUBOMHRU4txm"
          Write-Host "Descargando el video de prueba desde Google Drive..."
          curl.exe --fail --location --silent --show-error --retry 3 --retry-delay 2 --output $videoPath $videoUrl
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo descargar el video original desde Google Drive."
          }
          $videoFile = Get-Item $videoPath
          if ($videoFile.Length -ne 14444160) {
            throw "El tamaño del video descargado no coincide con el archivo esperado: $($videoFile.Length) bytes."
          }
          $signature = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($videoPath), 0, 12)
          if (!$signature.StartsWith("RIFF") -or $signature.Substring(8, 4) -ne "AVI ") {
            throw "El archivo descargado no tiene una cabecera AVI válida."
          }

          # Ejecuta el mismo flujo CLI con Python en el runner. La aplicación
          # empaquetada ya tiene su propia prueba de inicialización arriba; así
          # la captura no depende de la redirección stdout/stderr de --windowed.
          python main.py --test-video $videoPath --template "tests/fixtures/Steve_29532/Steve.miobject" --output "artifacts/Steve_29532_animado.miobject" --calibration-time 0.8
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            if (Test-Path $runtimeLog) {
              Get-Content -Path $runtimeLog -Tail 300
            }
            exit $exitCode
          }

          $reportPath = "artifacts/Steve_29532_animado.diagnostico.json"
          if (!(Test-Path $reportPath)) {
            if (Test-Path $runtimeLog) { Get-Content -Path $runtimeLog -Tail 300 }
            throw "No se generó el informe de diagnóstico."
          }
          if (!(Test-Path "artifacts/Steve_29532_animado.miobject")) {
            throw "No se generó la animación .miobject."
          }
          $report = Get-Content -Path $reportPath -Raw | ConvertFrom-Json
          Write-Host ("Cobertura: {0}% · cuerpo completo: {1}% · confianza: {2} · keyframes: {3}" -f $report.inference.pose_coverage_percent, $report.inference.complete_body_coverage_percent, $report.inference.mean_tracked_landmark_confidence, $report.export.total_keyframes)

      - name: Publicar animación y diagnóstico de la prueba
        uses: actions/upload-artifact@v4
        with:
          name: MotionCapture-Regression-Animation
          path: |
            artifacts/Steve_29532_animado.miobject
            artifacts/Steve_29532_animado.diagnostico.json
          if-no-files-found: error
          retention-days: 14

      - name: Publicar un único ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: MineimatorMotionCapture-RTMPose-MotionBERT-Windows
          path: dist/MineimatorMotionCapture/
          if-no-files-found: error
          retention-days: 14
