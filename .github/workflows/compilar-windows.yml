name: Compilar Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Pruebas y compilación
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Validar importación de vídeo con MediaPipe Heavy
        run: >
          python -m mocap_app.video_test
          --video tests/fixtures/Steve_29532/29532_normalizado_30fps.avi
          --template tests/fixtures/Steve_29532/Steve.miobject
          --output artifacts/regression/Steve_29532_animado.miobject

      - name: Publicar resultado de la prueba de movimiento
        uses: actions/upload-artifact@v4
        with:
          name: MotionCapture-Regression-Animation
          path: artifacts/regression/
          if-no-files-found: error
          retention-days: 14

      - name: Comprobar sintaxis
        run: python -m compileall -q main.py mocap_app tests

      - name: Crear aplicación para Windows
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name MineimatorMotionCapture
          --collect-all mediapipe
          --collect-all cv2
          --collect-all cv2_enumerate_cameras
          --collect-all PySide6
          main.py

      - name: Publicar un único ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: MineimatorMotionCapture-Windows
          path: dist/MineimatorMotionCapture/
          if-no-files-found: error
          retention-days: 14
