name: Compilar Windows

on:
  push:
    branches:
      - main
      - feature/rtmpose-motionbert
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motionbert-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Pruebas y compilación
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install openmim
          mim install mmengine
          mim install mmcv==2.1.0
          pip install -r requirements-mmpose.txt
          python -m pip check

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Comprobar sintaxis
        run: python -m compileall -q main.py mocap_app tests

      - name: Crear aplicación para Windows
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name MineimatorMotionCapture
          --collect-all cv2
          --collect-all cv2_enumerate_cameras
          --collect-all PySide6
          --collect-all torch
          --collect-all torchvision
          --collect-all mmcv
          --collect-all mmengine
          --collect-all mmdet
          --collect-all mmpose
          main.py

      - name: Publicar un único ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: MineimatorMotionCapture-RTMPose-MotionBERT-Windows
          path: dist/MineimatorMotionCapture/
          if-no-files-found: error
          retention-days: 14
